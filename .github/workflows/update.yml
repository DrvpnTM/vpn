name: Update free configs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install xray-knife (real connection / ping test)
        run: |
          curl -sSL -o /tmp/xk.zip https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -oq /tmp/xk.zip -d /tmp/xk
          echo "XRAY_KNIFE=/tmp/xk/xray-knife" >> "$GITHUB_ENV"
      - run: python3 scripts/update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub_base64.txt subs subscriptions.json
          git diff --cached --quiet || git commit -m "Update free configs"
          git push
